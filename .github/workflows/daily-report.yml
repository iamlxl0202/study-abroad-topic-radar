name: Update daily topic report
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run generate
      - name: Commit updated report
        run: |
          git config user.name "topic-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/topics.json
          git diff --cached --quiet || git commit -m "chore: update daily topic report"
          git push
